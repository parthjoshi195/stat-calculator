<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats Solver - Step by Step</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header-bar">
    <h2>DATA HUB</h2>
  </div>

  <div class="container">
    <h1>Step-by-Step Stats Solver</h1>
    <p class="subtitle">Pick a calculation, paste your numbers, and see every step.</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="stddev">Std Deviation</button>
      <button class="tab-btn" data-tab="meanmed">Mean/Median/Mode</button>
      <button class="tab-btn" data-tab="zscore">Z-Score</button>
    </div>

    <div id="stddev-panel" class="tab-panel active">
      <textarea id="nums-stddev" rows="3" placeholder="Enter numbers separated by commas, e.g. 4, 8, 15, 16, 23, 42"></textarea>
      <label class="scan-btn" for="photo-stddev">📷 Scan a photo for numbers</label>
      <input type="file" id="photo-stddev" accept="image/*" capture="environment" style="display:none;">
      <p id="scanStatus-stddev" class="scan-status"></p>
      <button id="calcBtn-stddev">Show steps</button>
      <p id="err-stddev" class="error"></p>
      <div id="steps-stddev" class="steps-box"></div>
      <div id="check-stddev" class="check-box">
        <p class="check-label">Check your own answer</p>
        <div class="check-row">
          <input id="userAnswer-stddev" type="text" placeholder="Your std dev answer">
          <button id="checkBtn-stddev">Check</button>
        </div>
        <p id="checkErr-stddev" class="error"></p>
        <p id="checkResult-stddev" class="check-result"></p>
      </div>
    </div>

    <div id="meanmed-panel" class="tab-panel">
      <textarea id="nums-meanmed" rows="3" placeholder="Enter numbers separated by commas, e.g. 4, 8, 15, 16, 23, 42"></textarea>
      <label class="scan-btn" for="photo-meanmed">📷 Scan a photo for numbers</label>
      <input type="file" id="photo-meanmed" accept="image/*" capture="environment" style="display:none;">
      <p id="scanStatus-meanmed" class="scan-status"></p>
      <button id="calcBtn-meanmed">Show steps</button>
      <p id="err-meanmed" class="error"></p>
      <div id="steps-meanmed" class="steps-box"></div>
    </div>

    <div id="zscore-panel" class="tab-panel">
      <p class="field-label">Value (x)</p>
      <input id="zscore-x" type="text" placeholder="e.g. 85">
      <p class="field-label">Mean</p>
      <input id="zscore-mean" type="text" placeholder="e.g. 75">
      <p class="field-label">Standard deviation</p>
      <input id="zscore-sd" type="text" placeholder="e.g. 8">
      <button id="calcBtn-zscore">Show steps</button>
      <p id="err-zscore" class="error"></p>
      <div id="steps-zscore" class="steps-box"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
